profile: library
exceptions:
  - rule: DES-003
    reason: the postgresadapter tests keep their postgrestest.Server, the one embedded PostgreSQL of the test binary, in a package variable (export_test.go). TestMain has no other channel to the tests, and a server per test is the slow path TST-002 steers away from. Test code only; the library has no mutable package state.
  - rule: LIB-001
    reason: postgresadapter.Observer announces in its doc comment that it may gain methods in minor versions, as jobs.Observer does. Adding such a method breaks an implementation outside this module, which LIB-001 would count as a breaking minor; the documented policy makes it part of the v1 contract instead. Every other exported API follows LIB-001.
